  <circle cx="75" cy="60" r="6" fill="#8FC0D8" opacity="0.5"/>
  <circle cx="55" cy="105" r="7" fill="#F5C030" opacity="0.4"/>
  <circle cx="78" cy="90" r="5" fill="#F8B0B8" opacity="0.45"/>
  <circle cx="38" cy="100" r="5.5" fill="#8FC0D8" opacity="0.4"/>
  <!-- Shine -->
